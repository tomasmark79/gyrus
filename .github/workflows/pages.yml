name: Play Gyrus on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21
        with:
          flakehub: false
      - name: Build WebAssembly release
        run: make cross-wasm
      - name: Assemble playable site
        run: |
          mkdir -p build/pages
          cp build/builddir-wasm-release/Gyrus.html build/pages/index.html
          cp build/builddir-wasm-release/Gyrus.js build/pages/
          cp build/builddir-wasm-release/Gyrus.wasm build/pages/
          cp LICENSE build/pages/LICENSE.txt
          cp LICENSE.template build/pages/LICENSE.template.txt
          touch build/pages/.nojekyll
      - name: Publish release branch
        run: |
          git fetch origin gh-pages
          git worktree add --detach build/publish FETCH_HEAD
          cp -a build/pages/. build/publish/
          git -C build/publish config user.name 'github-actions[bot]'
          git -C build/publish config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C build/publish add .
          if ! git -C build/publish diff --cached --quiet; then
            git -C build/publish commit -m "Publish Gyrus from ${GITHUB_SHA}"
            git -C build/publish push origin HEAD:gh-pages
          fi
      - name: Request Pages publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
