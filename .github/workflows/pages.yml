name: Play Gyrus on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21
        with:
          flakehub: false
      - name: Build WebAssembly release
        run: make cross-wasm
      - name: Assemble playable site
        run: |
          mkdir -p build/pages
          cp build/builddir-wasm-release/Gyrus.html build/pages/index.html
          cp build/builddir-wasm-release/Gyrus.js build/pages/
          cp build/builddir-wasm-release/Gyrus.wasm build/pages/
          cp LICENSE build/pages/LICENSE.txt
          cp LICENSE.template build/pages/LICENSE.template.txt
          touch build/pages/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
